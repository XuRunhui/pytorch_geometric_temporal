# PyTorch Lightning Trainer configuration for single GPU training
# @package trainer
_target_: pytorch_lightning.Trainer

# Basic training settings
max_epochs: 50
min_epochs: 10
check_val_every_n_epoch: 1

# Hardware settings - Single GPU only
accelerator: "gpu"
devices: 1
# No strategy specified - use default single GPU training
precision: 32

# Performance optimizations
benchmark: true
deterministic: false

# Training behavior
gradient_clip_val: 1.0
gradient_clip_algorithm: "norm"
accumulate_grad_batches: 1

# Logging and monitoring
log_every_n_steps: 1
enable_progress_bar: true
enable_model_summary: true

# Validation and testing - debugging mode
limit_train_batches: 1.0  # Limited for debugging
limit_val_batches: 1.0     # Limited for debugging  
limit_test_batches: 1.0
val_check_interval: 1.0

# Checkpointing
enable_checkpointing: true
default_root_dir: null

# Debugging and profiling
fast_dev_run: false
overfit_batches: 0
detect_anomaly: false

