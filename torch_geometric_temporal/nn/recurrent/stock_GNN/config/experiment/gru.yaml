# @package _global_
# GAT experiment configuration - Dynamic Graph with ASTGCN

defaults:
  - override /data: stock_data
  - override /model: dynamic_graph
  - override /loss: return_loss
  - override /trainer: ddp_gpu
  - override /callbacks: default
  - override /logger: tensorboard
  - override /training_module: dynamic_graph_lightning

# Experiment metadata
experiment:
  name: "gru_experiment"
  version: null  # Auto-generated if null
  description: "Experiment using GAT-like dynamic graph with ASTGCN for stock factor prediction"
  tags: ["gat", "astgcn", "stock", "dynamic_graph", "factor_prediction"]

# Random seed for reproducibility
seed: 42

model:
  pure_gru: true


trainer:
  strategy: "ddp_find_unused_parameters_true" 

logger:
  name: "gru_experiment_feature_loss"